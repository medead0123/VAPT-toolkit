version: "3.8"

# Lab environment for this VAPT project.
# Run: docker compose up -d
# Juice Shop  -> http://localhost:3000
# OWASP ZAP   -> http://localhost:8080 (API), used optionally by vapt/scanner/zap_scan.py

services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped

  zap:
    image: zaproxy/zap-stable
    container_name: owasp-zap
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    restart: unless-stopped
